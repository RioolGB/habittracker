services:
  postgres:
    image: postgres:16-alpine
    container_name: habittracker_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: habittracker
      POSTGRES_PASSWORD: habittracker
      POSTGRES_DB: habittracker
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: habittracker_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data: